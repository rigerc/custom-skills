name: Prepare Laya ONNX checkpoint
description: Restore and verify the Laya split-ONNX cache, exporting it on a miss
outputs:
  cache-hit:
    description: Whether the existing cache was restored
    value: ${{ steps.model-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore split-ONNX model
      id: model-cache
      uses: actions/cache/restore@v4
      with:
        path: .cache/laya-model
        key: laya-onnx-4ac226d5ee88-english-v2

    - name: Check required model files
      id: model-files
      shell: bash
      run: |
        set -euo pipefail
        dir=".cache/laya-model"
        valid=true
        for file in encoder.onnx head.onnx tokenizer.json rl_agent_config.json; do
          if [[ ! -s "$dir/$file" ]]; then
            echo "Missing or empty: $dir/$file"
            valid=false
          fi
        done
        echo "valid=$valid" >> "$GITHUB_OUTPUT"

    - name: Reject incomplete restored cache
      if: steps.model-cache.outputs.cache-hit == 'true' && steps.model-files.outputs.valid != 'true'
      shell: bash
      run: |
        echo "::error::Cached Laya model is incomplete. Invalidate the cache by bumping the key in .github/actions/laya-model/action.yml."
        exit 1

    - name: Set up Python for model export
      if: steps.model-files.outputs.valid != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Export split-ONNX checkpoint (cache miss only)
      if: steps.model-files.outputs.valid != 'true'
      shell: bash
      env:
        HF_HOME: ${{ github.workspace }}/.cache/huggingface
      run: |
        set -euo pipefail
        # CPU-only Torch avoids the much larger default CUDA dependency set.
        python -m pip install --disable-pip-version-check \
          --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
        python -m pip install --disable-pip-version-check \
          -e './.laya-src[onnx]' 'transformers>=4.48,<5'
        python .laya-src/laya-ts/scripts/export_onnx.py \
          --repo convaiinnovations/laya \
          --out-dir .cache/laya-model

    - name: Validate prepared model files
      shell: bash
      run: |
        set -euo pipefail
        for file in encoder.onnx head.onnx tokenizer.json rl_agent_config.json; do
          test -s ".cache/laya-model/$file" || {
            echo "::error::Missing/empty exported model file: $file"
            exit 1
          }
        done
        if [[ "${{ steps.model-cache.outputs.cache-hit }}" == true ]]; then
          echo "Laya ONNX checkpoint: restored from cache." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Laya ONNX checkpoint: exported (cache miss)." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Save split-ONNX model for subsequent workflows
      if: steps.model-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .cache/laya-model
        key: laya-onnx-4ac226d5ee88-english-v2
