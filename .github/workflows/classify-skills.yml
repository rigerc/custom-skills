name: Classify skills with Laya

on:
  pull_request:
    paths:
      - 'catalog.json'
      - 'scripts/classify-skills.mjs'
      - 'tests/classify-skills.test.mjs'
      - '.github/actions/laya-model/**'
      - '.github/workflows/warm-laya-cache.yml'
      - '.github/workflows/classify-skills.yml'
  push:
    branches: [main]
    paths:
      - 'catalog.json'
      - 'skills/**'
      - '.github/actions/laya-model/**'
      - 'scripts/classify-skills.mjs'
      - '.github/workflows/classify-skills.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Classify registry entries or the built-in AutoSkills map'
        type: choice
        options: [catalog, map]
        default: catalog
        required: true
      limit:
        description: 'Maximum number of skills to classify'
        type: number
        default: 100
        required: true
      threshold:
        description: 'Minimum P(yes) for a suggested technology'
        type: choice
        options: ['0.80', '0.90', '0.95']
        default: '0.90'
        required: true

      propose_updates:
        description: 'Create a review PR proposing high-confidence catalog technology tags'
        type: boolean
        default: false
  schedule:
    - cron: '19 6 * * 1' # Weekly advisory report; never applies catalog edits.

# Weekly and push runs are advisory. Only an explicit manual request can propose a PR.
permissions:
  contents: read

concurrency:
  group: laya-classification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test classifier (no model download)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AST parser
        run: npm install --no-save --ignore-scripts typescript@5.9.3
      - name: Run classifier fixture tests
        run: node --test tests/classify-skills.test.mjs

  classify:
    name: Build ONNX model and classify skills
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MODE: ${{ inputs.mode || 'catalog' }}
      LIMIT: ${{ inputs.limit || '100' }}
      THRESHOLD: ${{ inputs.threshold || '0.90' }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PROPOSE_UPDATES: ${{ inputs.propose_updates || 'false' }}
      IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
      ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: 4ac226d5ee88ed6df8db288a05c766d7a34ee682
          path: .laya-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Laya TypeScript runtime
        run: |
          npm install --no-save --ignore-scripts typescript@5.9.3
          npm ci --prefix .laya-src/laya-ts
          npm run build --prefix .laya-src/laya-ts
      - name: Restore or export split-ONNX checkpoint
        uses: ./.github/actions/laya-model
      - name: Reconcile local catalog without pushing
        if: env.MODE == 'catalog'
        run: npm run catalog:sync
      - name: Classify and write JSON report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          args=(--mode "$MODE" --catalog catalog.json --model ./.cache/laya-model \
            --laya ./.laya-src/laya-ts/dist/index.js --threshold "$THRESHOLD" \
            --limit "$LIMIT" --output reports/laya-classifications.json)
          if [[ "$IS_MANUAL" == true && "$ON_DEFAULT_BRANCH" == true && "$MODE" == catalog && "$PROPOSE_UPDATES" == true ]]; then
            args+=(--write)
          fi
          node scripts/classify-skills.mjs "${args[@]}"
      - name: Summarize classification results
        shell: bash
        run: |
          node -e '
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("reports/laya-classifications.json", "utf8"));
          const records = data.records || [];
          const review = records.filter(item => item.needsReview).length;
          const additions = records.reduce((n, item) => n + (item.proposedAdditions || []).length, 0);
          const lines = [
            "### Laya AutoSkills classification",
            "Mode: " + data.mode,
            "Skills classified: " + records.length,
            "Flagged for manual review: " + review,
            "Technology tag suggestions: " + additions,
            "Download the JSON report from workflow artifacts."
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Upload classification report
        uses: actions/upload-artifact@v4
        with:
          name: laya-${{ env.MODE }}-classifications
          path: reports/laya-classifications.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload proposed catalog for review
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.mode == 'catalog' && inputs.propose_updates == true
        uses: actions/upload-artifact@v4
        with:
          name: laya-catalog-proposal
          path: catalog.json
          if-no-files-found: error
          retention-days: 7

  propose:
    name: Open review PR for classified tags
    needs: classify
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.mode == 'catalog' && inputs.propose_updates == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download reviewed catalog proposal
        uses: actions/download-artifact@v4
        with:
          name: laya-catalog-proposal
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript parser for validation
        run: npm install --no-save --ignore-scripts typescript@5.9.3
      - name: Validate proposed catalog and skills
        run: |
          npm run catalog:check
          npm test
      - name: Open review PR with suggested mappings
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: catalog.json
          branch: automation/laya-catalog-tags
          delete-branch: true
          commit-message: 'chore(skills): propose Laya technology tags'
          title: 'chore(skills): review Laya-classified technology tags'
          body: |
            This PR proposes AutoSkills technology IDs using Laya classification.
            Only known SKILLS_MAP IDs are added, without deleting existing mappings.
            Download the classification JSON from the triggering workflow run.
            Confidence is not calibrated on this catalog: manually verify before merging.
