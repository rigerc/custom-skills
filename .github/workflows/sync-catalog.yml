name: Sync AutoSkills catalog

on:
  push:
    paths:
      - 'skills/**'
      - 'catalog.json'
      - 'scripts/sync-catalog.mjs'
      - '.github/workflows/sync-catalog.yml'
  workflow_dispatch:

# Only the default branch is modified. Fork PRs never receive write credentials.
permissions:
  contents: write

concurrency:
  group: catalog-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript parser for the complete test suite
        run: npm install --no-save --ignore-scripts typescript@5.9.3
      - name: Generate catalog from SKILL.md frontmatter
        run: npm run catalog:sync
      - name: Validate generated catalog and skills
        run: npm test
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- catalog.json; then
            echo 'Catalog already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m 'chore(skills): sync autoskills catalog'
          git push origin "HEAD:${GITHUB_REF_NAME}"
