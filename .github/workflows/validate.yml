name: Validate AutoSkills catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate catalog for PR validation (no writes back to PR)
        run: npm run catalog:sync
      - name: Validate generated catalog and skill bundles
        run: npm test
      - name: Check catalog generation is deterministic
        run: npm run catalog:check
