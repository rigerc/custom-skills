name: Warm Laya model cache

on:
  workflow_dispatch:
  schedule:
    # Warm on Sunday before Monday's report and again midweek (cache may expire).
    - cron: '43 5 * * 0,4'

permissions:
  contents: read

concurrency:
  group: laya-model-warm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  warm:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Prepare cached split-ONNX checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned Laya source
        uses: actions/checkout@v4
        with:
          repository: NandhaKishorM/laya
          ref: 4ac226d5ee88ed6df8db288a05c766d7a34ee682
          path: .laya-src
          persist-credentials: false
      - name: Restore or export ONNX checkpoint
        uses: ./.github/actions/laya-model
