# Example only. Adapt npm, build commands and Node version to the project's lockfile.
name: Test
on:
  push:
  pull_request:
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run
